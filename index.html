<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Koperasi SMK MHC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Times New Roman', Times, serif; background-color: #fffdf4; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-auth { background: #fffde7; border: 2px solid #ffeeba; border-radius: 16px; width: 100%; max-width: 450px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-custom { background-color: #ffc107; color: #212529; font-weight: bold; border: none; }
        .btn-custom:hover { background-color: #e0a800; color: #000; }
    </style>
</head>
<body>
    <div class="card-auth">
        <!-- Form Login -->
        <div id="formLogin">
            <h3 class="fw-bold text-center mb-1">Login Koperasi</h3>
            <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">SMK Muthia Harapan Cicalengka</p>
            <form onsubmit="prosesLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" id="loginEmail" class="form-control" required placeholder="Masukkan email">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="loginPassword" class="form-control" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 mb-3">Login</button>
            </form>
            <div class="text-center">
                <small class="text-muted">Belum punya akun? <a href="#" onclick="toggleForm()" class="text-dark fw-bold">Register di sini</a></small>
            </div>
        </div>

        <!-- Form Register -->
        <div id="formRegister" style="display: none;">
            <h3 class="fw-bold text-center mb-1">Daftar Akun Baru</h3>
            <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">Koperasi SMK MHC</p>
            <form onsubmit="prosesRegister(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nama Lengkap</label>
                    <input type="text" id="regNama" class="form-control" required placeholder="Nama Anda">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" id="regEmail" class="form-control" required placeholder="Email aktif">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="regPassword" class="form-control" required placeholder="Buat password">
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 mb-3">Register</button>
            </form>
            <div class="text-center">
                <small class="text-muted">Sudah punya akun? <a href="#" onclick="toggleForm()" class="text-dark fw-bold">Login di sini</a></small>
            </div>
        </div>
    </div>

    <script>
        function toggleForm() {
            let fLogin = document.getElementById('formLogin');
            let fReg = document.getElementById('formRegister');
            fLogin.style.display = fLogin.style.display === 'none' ? 'block' : 'none';
            fReg.style.display = fReg.style.display === 'none' ? 'block' : 'none';
        }

        function prosesRegister(e) {
            e.preventDefault();
            let nama = document.getElementById('regNama').value;
            let email = document.getElementById('regEmail').value;
            let password = document.getElementById('regPassword').value;

            let users = JSON.parse(localStorage.getItem('koperasi_users')) || [];
            if (users.find(u => u.email === email)) {
                alert('Email sudah terdaftar!');
                return;
            }

            // Menyimpan nama, email, dan password ke objek user
            users.push({ nama, email, password });
            localStorage.setItem('koperasi_users', JSON.stringify(users));

            // Simpan profil awal unik untuk email ini
            localStorage.setItem(`koperasi_profile_${email}`, JSON.stringify({
                nama: nama, kelas: "XII RPL 3", anggota: "0737291018", jurusan: "Rekayasa Perangkat Lunak", phone: "081234567890", alamat: "Bandung"
            }));

            alert('Registrasi berhasil! Silakan login.');
            toggleForm();
        }

        function prosesLogin(e) {
            e.preventDefault();
            let email = document.getElementById('loginEmail').value;
            let password = document.getElementById('loginPassword').value;

            let users = JSON.parse(localStorage.getItem('koperasi_users')) || [];
            let userValid = users.find(u => u.email === email && u.password === password);

            if (!userValid) {
                alert('Email atau password salah!');
                return;
            }

            // Simpan seluruh data user yang valid (termasuk nama)
            localStorage.setItem('koperasi_current_user', JSON.stringify(userValid));
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
